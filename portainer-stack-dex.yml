# Portainer stack for Dex-researcher (GPT Researcher + Next.js + optional RAG).
# Use this in Portainer: Stacks → Add Stack → Web editor (paste) or Upload this file.
# Set environment variables in Portainer (OPENAI_API_KEY, TAVILY_API_KEY, etc.).

services:
  gpt-researcher:
    build:
      context: .
      no_cache: true
    container_name: dex-gpt-researcher
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      EMBEDDING: ${EMBEDDING}
      LOGGING_LEVEL: INFO
      # In the gpt-researcher service, add to environment:
      FAST_LLM: ${FAST_LLM:-ollama:qwen3:30b-a3b}
      SMART_LLM: ${SMART_LLM:-ollama:qwen3-vl:32b}
      STRATEGIC_LLM: ${STRATEGIC_LLM:-ollama:qwen3-vl:32b-thinking-q4_K_M}
      RETRIEVER: ${RETRIEVER:-tavily}
      # If you use file audit:
      AUDIT_STORAGE: ${AUDIT_STORAGE:-file}
      AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-data/audit.jsonl}
      
      RAG_API_URL: ${RAG_API_URL:-}
      RAG_API_KEY: ${RAG_API_KEY:-}
      PRIVATE_MODE: ${PRIVATE_MODE:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      DOC_PATH: /usr/src/app/my-docs
      PORT: "8000"
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      IMAGE_GENERATION_ENABLED: ${IMAGE_GENERATION_ENABLED:-false}
      IMAGE_GENERATION_MODEL: ${IMAGE_GENERATION_MODEL:-}
      IMAGE_GENERATION_MAX_IMAGES: ${IMAGE_GENERATION_MAX_IMAGES:-3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dex-my-docs:/usr/src/app/my-docs:rw
      - dex-outputs:/usr/src/app/outputs:rw
      - dex-logs:/usr/src/app/logs:rw
    user: root
    restart: always
    ports:
      - "${GPTR_HOST_PORT:-8067}:8000"

  gptr-nextjs:
    build:
      dockerfile: Dockerfile.dev
      context: ./frontend/nextjs
      no_cache: true
    container_name: dex-gptr-nextjs
    stdin_open: true
    environment:
      CHOKIDAR_USEPOLLING: "true"
      LOGGING_LEVEL: INFO
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_GPTR_API_URL: "http://gpt-researcher:8000"
      PORT: 3037
    depends_on:
      - gpt-researcher
    volumes:
      - /app/node_modules
      - dex-outputs:/app/outputs
    restart: always
    ports:
      - "${NEXTJS_HOST_PORT:-3037}:3037"

volumes:
  dex-my-docs:
  dex-outputs:
  dex-logs:
