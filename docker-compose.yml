# Force rebuild - langchain-ollama package needed
services:
  gpt-researcher:
    pull_policy: build
    build:
      context: ./
      no_cache: true
    environment:
      # Ollama Configuration
      OPENAI_API_KEY: "ollama"
      OPENAI_BASE_URL: "http://host.docker.internal:11434/v1"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"

      # LLM Models (using your Ollama models)
      FAST_LLM: "ollama:qwen3:30B-A3B"          # ~3GB (already configured)
      SMART_LLM: "ollama:qwen3-vl:30B-A3B"         # ~19GB (upgrade from gpt-oss:20b)
      STRATEGIC_LLM: "ollama:qwen3-coder:latest"   # ~18GB (already configured)

      # Embedding Model
      EMBEDDING: "ollama:snowflake-arctic-embed2"
      OLLAMA_EMBEDDING_MODEL: "snowflake-arctic-embed2"
      EMBEDDING_PROVIDER: "ollama"

      # Search Configuration (set in .env or Portainer stack env)
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}

      # GPT Researcher Configuration - High Quality Research Settings
      MAX_ITERATIONS: "5"
      LOG_LEVEL: "INFO"
      PORT: "8000"
      DOC_PATH: "/usr/src/app/my-docs"

      # Token Limits (optimized for each model's context capabilities)
      FAST_TOKEN_LIMIT: "8000"        # qwen2.5vl: 128K context
      SMART_TOKEN_LIMIT: "12000"      # qwen3-vl: Large context
      STRATEGIC_TOKEN_LIMIT: "20000"  # qwen3-coder: 256K context
      SUMMARY_TOKEN_LIMIT: "1000"

      # Research Quality Settings
      MAX_SCRAPER_WORKERS: "20"
      MAX_SUBTOPICS: "5"
      TOTAL_WORDS: "2500"

      # Apache Tika Configuration for OCR
      TIKA_SERVER_URL: "http://host.docker.internal:9998"

      # Optional API keys and image generation (from upstream)
      LANGCHAIN_API_KEY: ""
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      IMAGE_GENERATION_ENABLED: ${IMAGE_GENERATION_ENABLED:-false}
      IMAGE_GENERATION_MODEL: ${IMAGE_GENERATION_MODEL:-gemini-2.0-flash-preview-image-generation}
      IMAGE_GENERATION_MAX_IMAGES: ${IMAGE_GENERATION_MAX_IMAGES:-3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      /bin/sh -c "
      pip install langchain-ollama>=0.3.3 &&
      python -m uvicorn main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      - ${PWD}/my-docs:/usr/src/app/my-docs:rw
      - ${PWD}/outputs:/usr/src/app/outputs:rw
      - ${PWD}/logs:/usr/src/app/logs:rw
    user: root
    restart: always
    ports:
      - 8067:8000

  gptr-nextjs:
    pull_policy: build
    image: gptresearcher/gptr-nextjs
    stdin_open: true
    environment:
      CHOKIDAR_USEPOLLING: "true"
      LOGGING_LEVEL: INFO
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      NEXT_PUBLIC_GPTR_API_URL: "http://gpt-researcher:8000"
      PORT: 3037
    depends_on:
      - gpt-researcher 
    build:
      dockerfile: Dockerfile.dev
      context: frontend/nextjs
      no_cache: true
    volumes:
      - /app/node_modules
      - ./frontend/nextjs:/app/src
      - ./frontend/nextjs/.next:/app/.next
      - ./outputs:/app/outputs
    restart: always
    ports:
      - 3037:3037

  gpt-researcher-tests:
    image: gptresearcher/gpt-researcher-tests
    build: ./
    environment: 
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      LOGGING_LEVEL: INFO
    profiles: ["test"]
    command: >
      /bin/sh -c "
      pip install pytest pytest-asyncio faiss-cpu &&
      python -m pytest tests/report-types.py &&
      python -m pytest tests/vector-store.py
      "

  discord-bot:
    build:
      context: ./docs/discord-bot
      dockerfile: Dockerfile.dev
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
    volumes:
      - ./docs/discord-bot:/app
      - /app/node_modules
    ports:
      - 3039:3000
    profiles: ["discord"]
    restart: always
