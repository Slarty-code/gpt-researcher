# Force rebuild - langchain-ollama package needed
services:
  rag-service:
    build: ./rag-service
    ports:
      - 8001:8000
    environment:
      LIGHTRAG_WORKING_DIR: ${LIGHTRAG_WORKING_DIR:-/data}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-ollama}
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ${RAG_DATA_PATH:-./rag-data}:/data:rw
    profiles:
      - rag

  gpt-researcher:
    pull_policy: build
    build:
      context: ./
      no_cache: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      EMBEDDING: ${EMBEDDING}
      LOGGING_LEVEL: INFO
      RAG_API_URL: ${RAG_API_URL:-}
      RAG_API_KEY: ${RAG_API_KEY:-}
      PRIVATE_MODE: ${PRIVATE_MODE:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      DOC_PATH: /usr/src/app/my-docs
      PORT: "8000"
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      IMAGE_GENERATION_ENABLED: ${IMAGE_GENERATION_ENABLED:-false}
      IMAGE_GENERATION_MODEL: ${IMAGE_GENERATION_MODEL:-}
      IMAGE_GENERATION_MAX_IMAGES: ${IMAGE_GENERATION_MAX_IMAGES:-3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PWD}/my-docs:/usr/src/app/my-docs:rw
      - ${PWD}/outputs:/usr/src/app/outputs:rw
      - ${PWD}/logs:/usr/src/app/logs:rw
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:ro
    user: root
    restart: always
    ports:
      - "${GPTR_HOST_PORT:-8067}:8000"

  gptr-nextjs:
    pull_policy: build
    image: gptresearcher/gptr-nextjs
    stdin_open: true
    environment:
      CHOKIDAR_USEPOLLING: "true"
      LOGGING_LEVEL: INFO
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      NEXT_PUBLIC_GPTR_API_URL: "http://gpt-researcher:8000"
      PORT: 3037
    depends_on:
      - gpt-researcher 
    build:
      dockerfile: Dockerfile.dev
      context: frontend/nextjs
      no_cache: true
    volumes:
      - /app/node_modules
      - ./frontend/nextjs:/app/src
      - ./frontend/nextjs/.next:/app/.next
      - ./outputs:/app/outputs
    restart: always
    ports:
      - "${NEXTJS_HOST_PORT:-3037}:3037"

  gpt-researcher-tests:
    image: gptresearcher/gpt-researcher-tests
    build: ./
    environment: 
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      EMBEDDING: ${EMBEDDING}
      LOGGING_LEVEL: INFO
    profiles: ["test"]
    command: >
      /bin/sh -c "
      pip install pytest pytest-asyncio faiss-cpu &&
      python -m pytest tests/report-types.py &&
      python -m pytest tests/vector-store.py
      "

  discord-bot:
    build:
      context: ./docs/discord-bot
      dockerfile: Dockerfile.dev
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
    volumes:
      - ./docs/discord-bot:/app
      - /app/node_modules
    ports:
      - 3039:3000
    profiles: ["discord"]
    restart: always
